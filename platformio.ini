; PlatformIO Project Configuration File

[env:esp32-c3-ultrasonic-u8g2]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Enable LittleFS support (used by MeasurementLog)
board_build.filesystem = littlefs

lib_deps =
    olikraus/U8g2 @ ^2.35.19
    knolleary/PubSubClient @ ^2.8

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ---- Optional STA + Blynk credentials (override locally) ----
; Leave WIFI_SSID empty to disable STA+Adafruit and run AP-only.
    '-D WIFI_SSID=""'
    '-D WIFI_PASS=""'

; ---- Adafruit IO (fill these to enable publish) ----
    '-D AIO_USERNAME=""'
    '-D AIO_KEY=""'
    '-D AIO_FEED_DISTANCE_CM="distance-cm"'